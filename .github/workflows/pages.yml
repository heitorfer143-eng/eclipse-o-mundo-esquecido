name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  configure-pages:
    name: Configure Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

  build:
    name: Prepare authenticated game redirect
    runs-on: ubuntu-latest
    needs: configure-pages
    permissions:
      contents: read
    steps:
      - name: Create redirect page
        run: |
          mkdir -p pages-redirect
          cat > pages-redirect/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0;url=https://eclipse-zhfl8j3s.manus.game/">
              <meta name="robots" content="noindex">
              <title>Eclipse: O Mundo Esquecido</title>
            </head>
            <body>
              <p>O jogo agora usa login seguro. Se o redirecionamento não acontecer, <a href="https://eclipse-zhfl8j3s.manus.game/">abra Eclipse: O Mundo Esquecido</a>.</p>
            </body>
          </html>
          EOF
          touch pages-redirect/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-redirect

  deploy:
    name: Deploy public site
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
